[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attire-compliance"
version = "0.1.0"
description = "Sistem deteksi etika berpakaian mahasiswa berbasis YOLOv12 dan EfficientNetV2"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "ultralytics>=8.3.0",
    "timm>=1.0.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
data = [
    "datasets>=3.0.0",
    "fiftyone>=1.0.0",
    "graphql-core>=3.2.0,<3.3.0",
    "imagehash>=4.3.1",
    "pillow-heif>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
attire = "attire_compliance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/attire_compliance"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
